# Uji admin lokal (Sveltia CMS). Hanya dilayani oleh `npm run dev`, tidak pernah masuk dist.
# Alur: buka /olyps-site/admin/ di Chrome/Edge/Brave, klik "Work with Local Repository", pilih root proyek.
# Backend di bawah hanya syarat konfigurasi; nilai repo boleh sembarang, tidak ada token atau OAuth.
# Sumber kebenaran skema tetap src/content.config.ts: bila berubah, ubah juga berkas ini.
backend:
  name: github
  repo: local/olyps-site
  branch: main

i18n:
  structure: multiple_folders
  locales: [en, id]
  default_locale: en

# Unggahan masuk src/assets/<jenis>/ (people, research, projects), diproses Astro, bukan public/. Folder diatur per koleksi di bawah.
# Batas: 1.500.000 byte per berkas (sama dengan maxFileBytes di scripts/predeploy.config.json).
# Admin mengecilkan ke webp maksimum 1920 px. Setelah menyimpan, integrations/dev-admin.mjs menjalankan scripts/tidy-assets.mjs
# (atau manual: npm run tidy:assets): nama berkas menjadi slug entri (mis. taufiq.webp), people maksimum 1024 px,
# research dan projects 1920 px, tanpa EXIF atau GPS.
media_folder: /src/assets/people
public_folder: /src/assets/people
media_libraries:
  default:
    config:
      max_file_size: 1500000
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1920
          height: 1920

# Menu admin mengikuti situs: Home, Projects, Research, Publications, People, Page titles and intros, Contact, Footer and Global, lalu tab Assets bawaan Sveltia.
# Urutan field di tiap formulir mengikuti urutan tampil di halaman, field penerbitan di bagian bawah. Setiap field punya petunjuk.
collections:
  - name: home
    label: Home
    i18n: true
    files:
      - name: text
        label: Home text
        i18n: true
        format: yaml-frontmatter
        extension: md
        file: src/content/home/{{locale}}/home.md
        fields:
          - name: eyebrow
            label: Eyebrow
            widget: string
            i18n: true
            hint: Small line above the main heading in the hero.
          - name: tagline
            label: Tagline
            widget: string
            i18n: true
            hint: Main heading of the hero. Also the site title on Home.
          - name: lead
            label: Lead
            widget: text
            i18n: true
            hint: Sentence under the heading in the hero.
          - name: ctaLabel
            label: Main button label
            widget: string
            i18n: true
            hint: Label of the hero button that scrolls to the next section.
          - name: featuredLabel
            label: Featured card label
            widget: string
            i18n: true
            hint: Small label on the featured project card in the hero.
          - name: exploreTitle
            label: "Next steps: title"
            widget: string
            i18n: true
            hint: Heading of the "Where to look next" section.
          - name: exploreResearchTitle
            label: "Card Research: title"
            widget: string
            i18n: true
            hint: Heading of the first card.
          - name: exploreResearchOne
            label: "Card Research: one entry"
            widget: string
            i18n: true
            hint: Text when there is exactly one research entry. Use {n} where the number goes.
          - name: exploreResearchOther
            label: "Card Research: several entries"
            widget: string
            i18n: true
            hint: Text when there are several research entries. Use {n} where the number goes.
          - name: explorePublicationsTitle
            label: "Card Publications: title"
            widget: string
            i18n: true
            hint: Heading of the second card.
          - name: explorePublicationsOne
            label: "Card Publications: one entry"
            widget: string
            i18n: true
            hint: Text when there is exactly one publication. Use {n} where the number goes.
          - name: explorePublicationsOther
            label: "Card Publications: several entries"
            widget: string
            i18n: true
            hint: Text when there are several publications. Use {n} where the number goes.
          - name: explorePeopleTitle
            label: "Card People: title"
            widget: string
            i18n: true
            hint: Heading of the third card.
          - name: explorePeopleOne
            label: "Card People: one person"
            widget: string
            i18n: true
            hint: Text when there is exactly one person. Use {n} where the number goes.
          - name: explorePeopleOther
            label: "Card People: several people"
            widget: string
            i18n: true
            hint: Text when there are several people. Use {n} where the number goes.
          - name: exploreEmpty
            label: "Cards: empty text"
            widget: string
            i18n: true
            hint: Shown on a card that has no entries yet.
          - name: whatTitle
            label: "What we work on: title"
            widget: string
            i18n: true
            hint: Heading of the featured projects section. The projects come from the Featured projects list.
          - name: whatEmpty
            label: "What we work on: empty text"
            widget: string
            i18n: true
            hint: Shown when no featured project can be shown.
          - name: translationKey
            label: Translation key
            widget: string
            i18n: duplicate
            hint: Keep as "home" in both languages.
          - name: lang
            label: Language
            widget: hidden
            default: "{{locale}}"
            i18n: true
      - name: featured
        label: Featured projects
        file: src/data/featured.json
        format: json
        fields:
          - name: featured
            label: Featured projects (max 3, ordered)
            widget: list
            root: true
            min: 0
            max: 3
            hint: 'Top to bottom: the first becomes the hero card on Home, the rest follow in "What we work on". Drag the handle (mouse) or use Move Up and Move Down to reorder. Maximum 3. The same project twice is rejected by the build.'
            field:
              name: key
              label: Project
              widget: relation
              collection: projects
              value_field: translationKey
              search_fields:
                - title
                - translationKey
              display_fields:
                - title
        i18n: false
  - name: projects
    label: Projects
    label_singular: Project
    folder: src/content/projects
    i18n: true
    format: yaml-frontmatter
    extension: md
    slug: "{{translationKey}}"
    create: true
    summary: "{{title}}"
    media_folder: /src/assets/projects
    public_folder: /src/assets/projects
    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
        hint: Page title and card heading.
      - name: placeholder
        label: Placeholder
        widget: boolean
        default: true
        i18n: duplicate
        hint: Shows a "Placeholder" badge. Entries marked as placeholder are hidden from the whole site on production builds. Turn off when the text is final.
      - name: summary
        label: Summary
        widget: text
        i18n: true
        hint: One or two sentences, shown on cards and under the title.
      - name: status
        label: Status
        widget: select
        options:
          - concept
          - exploratory
          - ongoing
          - paused
          - completed
        i18n: duplicate
        hint: Shown on cards and in the Timeline block.
      - name: startDate
        label: Start date
        widget: string
        required: false
        i18n: duplicate
        pattern:
          - ^\d{4}-(0[1-9]|1[0-2])$
          - Use YYYY-MM, for example 2026-11
        hint: Optional, format YYYY-MM (for example 2026-11). Shown as "Since Nov 2026".
      - name: endDate
        label: End date
        widget: string
        required: false
        i18n: duplicate
        pattern:
          - ^\d{4}-(0[1-9]|1[0-2])$
          - Use YYYY-MM, for example 2027-03
        hint: Format YYYY-MM. Required when status is completed, optional when paused, never before the start date. The form cannot enforce this; the build rejects it.
      - name: leadsTo
        label: Continues as
        widget: list
        required: false
        i18n: duplicate
        hint: Optional. translationKey of a project, research, or publication this work continues as (not itself). One key per row. The build rejects keys that do not exist.
      - name: leadsToUrl
        label: Continues at (URL)
        widget: string
        required: false
        i18n: duplicate
        pattern:
          - ^https?://\S+$
          - Use a full URL starting with https://
        hint: Optional external link shown under "Continues as". Opens in a new tab.
      - name: body
        label: Body
        widget: markdown
        required: false
        i18n: true
        hint: "Sections used: Goal, Scope, Roadmap, Impact. Roadmap and Impact are optional: leave them out and they are not shown."
      - name: relatedPeople
        label: Members
        widget: relation
        collection: people
        value_field: translationKey
        search_fields:
          - name
          - translationKey
        display_fields:
          - name
        multiple: true
        required: false
        i18n: duplicate
        hint: People who work on this project. Shown in the Related section.
      - name: relatedResearch
        label: Related research
        widget: relation
        collection: research
        value_field: translationKey
        search_fields:
          - title
          - translationKey
        display_fields:
          - title
        multiple: true
        required: false
        i18n: duplicate
        hint: "Shown in the Related section at the bottom of the page. Links are two-way: one side is enough."
      - name: relatedPublications
        label: Related publications
        widget: relation
        collection: publications
        value_field: translationKey
        search_fields:
          - title
          - translationKey
        display_fields:
          - title
        multiple: true
        required: false
        i18n: duplicate
        hint: "Shown in the Related section at the bottom of the page. Links are two-way: one side is enough."
      - name: image
        label: Image
        widget: image
        required: false
        i18n: duplicate
        hint: Optional picture in the right column. Upload goes to src/assets/projects and is renamed to the entry slug, converted to webp, resized to 1920 px, and stripped of metadata. Max 1,500,000 bytes. Leave empty to hide the media slot.
      - name: imageAlt
        label: Image alt text
        widget: string
        required: false
        i18n: true
        hint: Describes the image for screen readers. Leave empty only if the image is purely decorative.
      - name: imageCaption
        label: Image caption
        widget: string
        required: false
        i18n: true
        hint: Optional line under the image. Empty means no caption.
      - name: mediaVideo
        label: Video (base name)
        widget: string
        required: false
        i18n: duplicate
        hint: Advanced. Base name of a clip already in public/ (without .mp4 or .webm). Video upload is not available in this admin yet.
      - name: mediaCaptions
        label: Video captions (VTT)
        widget: string
        required: false
        i18n: true
        hint: Advanced. Path of the VTT file for this language, relative to public/.
      - name: order
        label: Order
        widget: number
        value_type: int
        required: false
        i18n: duplicate
        hint: "Optional. Smaller numbers appear first. Empty entries come last, then newest start date (publications: newest year), then title."
      - name: draft
        label: Draft
        widget: boolean
        default: false
        i18n: duplicate
        hint: Drafts are never published, in development or production.
      - name: translationKey
        label: Translation key
        widget: string
        i18n: duplicate
        pattern:
          - ^[a-z0-9-]+$
          - Lowercase letters, digits, and hyphens only
        hint: Identifier shared by the EN and ID versions and used by relations. Also the file name. Do not change it after publishing.
      - name: lang
        label: Language
        widget: hidden
        default: "{{locale}}"
        i18n: true
  - name: research
    label: Research
    label_singular: Research entry
    folder: src/content/research
    i18n: true
    format: yaml-frontmatter
    extension: md
    slug: "{{translationKey}}"
    create: true
    summary: "{{title}}"
    media_folder: /src/assets/research
    public_folder: /src/assets/research
    fields:
