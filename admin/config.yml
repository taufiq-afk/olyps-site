  - name: contact
    label: Contact
    label_singular: Contact page
    folder: src/content/contact
    i18n: true
    format: yaml-frontmatter
    extension: md
    slug: contact
    create: false
    delete: false
    summary: Contact page
    fields:
      - name: lead
        label: Introduction
        widget: text
        i18n: true
        hint: Opening sentence under the page title.
      - name: links
        label: Links
        widget: list
        i18n: true
        summary: "{{label}}"
        hint: Cards on the Contact page and the Connect column of the footer. All open in a new tab.
        fields:
          - name: label
            label: Label
            widget: string
            hint: Card heading, for example GitHub.
          - name: url
            label: URL
            widget: string
            hint: Full URL starting with https://.
          - name: kind
            label: Kind
            widget: select
            options:
              - github
              - linkedin
              - other
            default: other
            hint: Chooses the button text.
      - name: email
        label: Email
        widget: string
        required: false
        i18n: duplicate
        hint: "Optional. Leave empty: the site shows no email unless one is entered here."
      - name: translationKey
        label: Translation key
        widget: string
        i18n: duplicate
        pattern:
          - ^[a-z0-9-]+$
          - Lowercase letters, digits, and hyphens only
        hint: Keep as "contact" in both languages.
      - name: lang
        label: Language
        widget: hidden
        default: "{{locale}}"
        i18n: true
  - name: footer_global
    label: Footer and Global
    i18n: true
    files:
