            i18n: true
            hint: Heading of the column with up to 3 projects, in display order.
          - name: researchTitle
            label: "Column: Research title"
            widget: string
            i18n: true
            hint: Heading of the column with up to 3 research entries, in display order.
          - name: connectTitle
            label: "Column: Connect title"
            widget: string
            i18n: true
            hint: Heading of the column with the links from the Contact page.
          - name: note
