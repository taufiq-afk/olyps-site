  - name: publications
    label: Publications
    label_singular: Publication
    folder: src/content/publications
    i18n: true
    format: yaml-frontmatter
    extension: md
    slug: "{{translationKey}}"
    create: true
    summary: "{{title}} ({{year}})"
    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
        hint: Exact title as published.
      - name: placeholder
        label: Placeholder
        widget: boolean
        default: true
        i18n: duplicate
        hint: Shows a "Placeholder" badge. Entries marked as placeholder are hidden from the whole site on production builds. Turn off when the text is final.
      - name: authors
        label: Authors
        widget: list
        i18n: duplicate
        summary: "{{name}}"
        hint: In printed order. Each author is plain text, or pick a member to link the name to their profile.
        fields:
          - name: name
            label: Name as printed
            widget: string
            hint: Name exactly as it appears on the paper.
          - name: personKey
            label: Member (optional)
            widget: relation
            collection: people
            value_field: translationKey
            search_fields:
              - name
              - translationKey
            display_fields:
